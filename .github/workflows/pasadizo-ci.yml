# Pasadizo CI: build the release binaries and test the packages Pasadizo changes,
# on every push to main and every pull request. Upstream's own workflows
# (test.yml, master.yml, scripts.yml) run only on upstream's branch names, so
# they do not run here.
name: pasadizo-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # The Go release in go.work (hyperbole.py refuses an older one)
          go-version: "1.27.4"
      - name: Build (linux amd64 and arm64, upstream's release flags)
        run: .github/pasadizo/build.sh
      - name: The binary reports its version
        run: build/hysteria-linux-amd64 version
      - name: Vet and test the direct outbound
        working-directory: extras
        run: |
          go vet ./outbounds/...
          go test -race -count=1 ./outbounds/...
      - name: Vet and test Careful Resume
        run: |
          (cd core && go vet ./internal/congestion/... ./server/... && go test -race -count=1 ./internal/congestion/... ./server/...)
          (cd app && go vet ./cmd/ && go test -count=1 ./cmd/)
      - name: Format (gofumpt, as upstream checks it)
        run: |
          unformatted="$(go run mvdan.cc/gofumpt@latest -l -extra extras/outbounds core/internal/congestion core/server app/cmd)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
